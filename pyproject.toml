[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismquant"
version = "0.1.0"
description = "Quantizer-aware anchor rotations for low-bit language models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.8,<3", "transformers>=5.0,<6", "huggingface-hub>=1.0,<2", "accelerate>=1.0", "numpy>=1.26", "safetensors>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
figures = ["PyMuPDF>=1.24", "Pillow>=10"]
kernels = ["triton>=3.4; platform_system == 'Linux'"]

[project.urls]
Homepage = "https://github.com/ForeverBlue816/PrismQuant"
Repository = "https://github.com/ForeverBlue816/PrismQuant"
Issues = "https://github.com/ForeverBlue816/PrismQuant/issues"

[project.scripts]
prismquant = "prismquant.cli:main"

[tool.setuptools.packages.find]
include = ["prismquant*"]

[tool.setuptools.package-data]
prismquant = ["models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
